name: Feature Request
description: Propose an audit vector, detection heuristic, or UX improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the new privacy vector or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security & Privacy Value
      description: How does this help users detect or prevent privacy exposures?
    validations:
      required: true
